<!doctype html>
<html>

<head>
    <title>Hotel RMS - Guest Portal</title>
    <link rel="stylesheet" href="../Design/Guest.css">
    <script src="../JS/Guest.js"></script>
</head>

<body>

    <!-- Upor er header -->
    <div class="header">
        <h2>🏨 Hotel RMS</h2>
        <span>Guest Portal</span>
    </div>

    <div class="container">

        <!-- Bam pashe sidebar, 3 ta button -->
        <div class="sidebar">
            <h4>Guest Menu</h4>
            <button id="btn1" class="active" onclick="showSection('bookSection', 'btn1')">Book a Room</button>
            <button id="btn2" onclick="showSection('bookingsSection', 'btn2')">My Bookings</button>
            <button id="btn3" onclick="showSection('feedbackSection', 'btn3')">Feedback</button>
        </div>

        <!-- Dan pashe main content -->
        <div class="main">
            <h1>Guest Panel</h1>
            <p>Welcome to Hotel RMS. Book your favourite room with us.</p>

            <!-- Section 1: Book a Room -->
            <div id="bookSection">

                <div class="box">
                    <h3>Room Reservation</h3>

                    <label>Room Number</label>
                    <select id="roomSelect">
                        <option value="">Select a room</option>
                    </select>

                    <label>Check-in Date</label>
                    <input type="date" id="checkIn">

                    <label>Check-out Date</label>
                    <input type="date" id="checkOut">

                    <br><br>
                    <button class="blue-btn" onclick="confirmBooking()">Confirm Booking</button>
                    <button class="gray-btn" onclick="resetForm()">Reset</button>

                    <p id="bookMessage"></p>
                </div>

            </div>

            <!-- Section 2: My Bookings (shuru te hidden) -->
            <div id="bookingsSection" style="display: none;">
                <div class="box">
                    <h3>My Bookings</h3>
                    <div id="bookingList"></div>
                </div>
            </div>

            <!-- Section 3: Feedback (shuru te hidden) -->
            <div id="feedbackSection" style="display: none;">
                <div class="box">
                    <h3>Feedback</h3>
                    <textarea id="feedbackText" placeholder="Write your feedback here..."></textarea>
                    <br><br>
                    <button class="blue-btn" onclick="submitFeedback()">Submit</button>
                    <p id="feedbackMessage"></p>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
